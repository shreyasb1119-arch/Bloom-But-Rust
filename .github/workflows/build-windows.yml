name: Build Windows installer

# Manual cloud build: Actions tab -> "Build Windows installer" -> Run workflow.
# Produces an unsigned installer you can download from the run's Artifacts.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The updater signing key isn't available on forks, so skip updater artifacts.
      - name: Write build config
        shell: bash
        run: echo '{"bundle":{"createUpdaterArtifacts":false}}' > no-updater.json

      - name: Build installer
        run: bun run tauri build --bundles nsis --config no-updater.json

      - uses: actions/upload-artifact@v4
        with:
          name: bloom-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
