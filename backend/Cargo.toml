[package]
name = "bloom-backend"
version = "0.2.0"
edition = "2021"
description = "Bloom's Rust backend: a small local service that the React Native Windows UI talks to"

[[bin]]
name = "bloom-backend"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
